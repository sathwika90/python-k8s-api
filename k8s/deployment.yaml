apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-k8s-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-k8s-api
  template:
    metadata:
      labels:
        app: python-k8s-api
    spec:
      containers:
        - name: python-k8s-api
          image: python-k8s-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: python-k8s-api-service
spec:
  selector:
    app: python-k8s-api
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: NodePort